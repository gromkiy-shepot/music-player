<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Громкий Шепот — Музыкальный проект</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        /* Custom scrollbar for tracklist */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white">

    <!-- Header / Navbar -->
    <header class="w-full border-b border-white/10 bg-darkBg/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-accent to-purple-500 flex items-center justify-center shadow-lg shadow-accent/20">
                    <i class="fa-solid fa-bolt text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide">Громкий Шепот</h1>
                    <p class="text-xs text-white/50">Независимый музыкальный проект</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <a href="https://vk.com" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition-all">
                    <i class="fa-brands fa-vk text-lg"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Left Column: Active Track Cover & Info -->
        <div class="md:col-span-1 flex flex-col items-center text-center">
            <div class="relative group w-48 h-48 sm:w-60 sm:h-60 rounded-2xl overflow-hidden shadow-2xl shadow-accent/10 border border-white/10 bg-cardBg mb-6">
                <img id="current-cover" src="https://placehold.co/400x400/1e293b/6366f1?text=ГШ" alt="Обложка альбома" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/400x400/1e293b/6366f1?text=ГШ'">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                    <button onclick="togglePlay()" class="w-14 h-14 rounded-full bg-accent text-white flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-all">
                        <i id="overlay-play-icon" class="fa-solid fa-play text-lg ml-1"></i>
                    </button>
                </div>
            </div>

            <h2 id="current-title" class="text-xl font-bold tracking-tight text-white mb-1">Возвращайся в жизнь</h2>
            <p id="current-artist" class="text-sm text-white/60 mb-4">Громкий Шепот</p>
            
            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-white/70">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="player-status">Готов к прослушиванию</span>
            </div>
        </div>

        <!-- Right Column: Player Controls & Tracklist -->
        <div class="md:col-span-2 flex flex-col justify-between space-y-6">
            
            <!-- Player Controls Card -->
            <div class="bg-cardBg border border-white/10 rounded-2xl p-6 shadow-xl backdrop-blur-md">
                
                <!-- Timeline Slider -->
                <div class="mb-6">
                    <div class="flex justify-between text-xs text-white/50 mb-2 font-medium">
                        <span id="current-time">0:00</span>
                        <span id="total-duration">0:00</span>
                    </div>
                    <div id="progress-container" onclick="seekAudio(event)" class="w-full h-2 bg-white/10 rounded-full cursor-pointer relative group overflow-hidden">
                        <div id="progress-bar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-accent to-purple-500 rounded-full w-0 transition-all"></div>
                    </div>
                </div>

                <!-- Main Control Buttons -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-2">
                        <button onclick="toggleShuffle()" id="shuffle-btn" class="w-10 h-10 rounded-xl text-white/50 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center" title="Перемешать">
                            <i class="fa-solid fa-shuffle text-sm"></i>
                        </button>
                    </div>

                    <div class="flex items-center space-x-4">
                        <button onclick="prevTrack()" class="w-11 h-11 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition-all active:scale-95" title="Предыдущий трек">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        
                        <button onclick="togglePlay()" id="main-play-btn" class="w-14 h-14 rounded-full bg-accent hover:bg-accentHover text-white flex items-center justify-center shadow-lg shadow-accent/30 transition-all active:scale-95" title="Воспроизвести / Пауза">
                            <i id="main-play-icon" class="fa-solid fa-play text-xl ml-1"></i>
                        </button>
                        
                        <button onclick="nextTrack()" class="w-11 h-11 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition-all active:scale-95" title="Следующий трек">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                    </div>

                    <div class="flex items-center space-x-2">
                        <button onclick="toggleRepeat()" id="repeat-btn" class="w-10 h-10 rounded-xl text-white/50 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center" title="Повтор">
                            <i class="fa-solid fa-repeat text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Volume Control -->
                <div class="flex items-center space-x-3 pt-4 border-t border-white/5">
                    <button onclick="toggleMute()" id="mute-btn" class="text-white/60 hover:text-white transition-colors">
                        <i id="volume-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-accent">
                </div>
            </div>

            <!-- Tracklist Section -->
            <div class="bg-cardBg border border-white/10 rounded-2xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-4 px-2">
                    <h3 class="font-semibold text-sm tracking-wide text-white/80 flex items-center gap-2">
                        <i class="fa-solid fa-list-music text-accent"></i> Треклист альбома
                    </h3>
                    <span id="track-count" class="text-xs text-white/40">0 треков</span>
                </div>
                
                <div id="playlist" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Tracks injected via JS -->
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-white/10 py-6 text-center text-xs text-white/40">
        <p>&copy; 2026 Громкий Шепот. Все права защищены.</p>
    </footer>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <!-- Custom Notification/Message Box (No alert) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div id="modal-icon" class="w-12 h-12 rounded-full bg-accent/20 text-accent flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-info"></i>
            </div>
            <h4 id="modal-title" class="font-bold text-lg mb-2">Уведомление</h4>
            <p id="modal-text" class="text-sm text-white/70 mb-6">Текст сообщения...</p>
            <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-accent hover:bg-accentHover font-medium text-white transition-colors">Понятно</button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Плейлист проекта. Вы можете добавлять сюда свои треки (ссылки на mp3 файлы и обложки).
        // Для примера используются реальные открытые аудиофайлы или качественные демо-ссылки.
        const playlist = [
            {
                title: "Возвращайся в жизнь",
                artist: "Громкий Шепот",
                duration: "3:45",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://placehold.co/400x400/1e293b/6366f1?text=Возвращайся"
            },
            {
                title: "72 часа",
                artist: "Громкий Шепот",
                duration: "4:12",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "https://placehold.co/400x400/1e293b/ec4899?text=72+часа"
            },
            {
                title: "Ночной город",
                artist: "Громкий Шепот",
                duration: "3:20",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                cover: "https://placehold.co/400x400/1e293b/8b5cf6?text=Ночной+город"
            },
            {
                title: "Эхо тишины",
                artist: "Громкий Шепот",
                duration: "3:58",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                cover: "https://placehold.co/400x400/1e293b/06b6d4?text=Эхо"
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let previousVolume = 1;

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('main-play-btn');
        const playIcon = document.getElementById('main-play-icon');
        const overlayPlayIcon = document.getElementById('overlay-play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const currentTitleEl = document.getElementById('current-title');
        const currentArtistEl = document.getElementById('current-artist');
        const currentCoverEl = document.getElementById('current-cover');
        const playerStatus = document.getElementById('player-status');
        const playlistContainer = document.getElementById('playlist');
        const trackCountEl = document.getElementById('track-count');

        // Инициализация плеера при загрузке страницы
        window.onload = function() {
            renderPlaylist();
            loadTrack(currentTrackIndex);

            // Обработчики событий аудиоэлемента
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', handleTrackEnd);
            audio.addEventListener('error', handleAudioError);
        };

        // Отрисовка списка треков
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            trackCountEl.textContent = `${playlist.length} треков`;

            playlist.forEach((track, index) => {
                const isCurrent = index === currentTrackIndex;
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all border ${
                    isCurrent 
                        ? 'bg-accent/10 border-accent/40 text-white shadow-md' 
                        : 'bg-white/5 border-white/5 hover:bg-white/10 text-white/70 hover:text-white'
                }`;
                item.onclick = () => selectTrack(index);

                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-lg overflow-hidden bg-white/10 flex-shrink-0 relative">
                            <img src="${track.cover}" alt="${track.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/1e293b/6366f1?text=ГШ'">
                            ${isCurrent && isPlaying ? '<div class="absolute inset-0 bg-black/40 flex items-center justify-center"><i class="fa-solid fa-volume-high text-accent text-xs animate-pulse"></i></div>' : ''}
                        </div>
                        <div class="truncate">
                            <h4 class="font-medium text-sm truncate ${isCurrent ? 'text-accent font-semibold' : ''}">${track.title}</h4>
                            <p class="text-xs text-white/40 truncate">${track.artist}</p>
                        </div>
                    </div>
                    <div class="text-xs text-white/40 font-mono pl-2">${track.duration}</div>
                `;
                playlistContainer.appendChild(item);
            });
        }

        // Загрузка трека
        function loadTrack(index) {
            currentTrackIndex = index;
            audio.src = playlist[index].src;
            currentTitleEl.textContent = playlist[index].title;
            currentArtistEl.textContent = playlist[index].artist;
            currentCoverEl.src = playlist[index].cover;
            renderPlaylist();
        }

        // Воспроизведение / Пауза
        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayIcons(true);
                    playerStatus.textContent = "Воспроизведение";
                    renderPlaylist();
                }).catch(err => {
                    showModal("Ошибка воспроизведения", "Не удалось запустить аудиофайл. Проверьте ссылку на трек.");
                });
            } else {
                audio.pause();
                isPlaying = false;
                updatePlayIcons(false);
                playerStatus.textContent = "Пауза";
                renderPlaylist();
            }
        }

        function updatePlayIcons(playing) {
            if (playing) {
                playIcon.className = "fa-solid fa-pause text-xl";
                overlayPlayIcon.className = "fa-solid fa-pause text-lg";
            } else {
                playIcon.className = "fa-solid fa-play text-xl ml-1";
                overlayPlayIcon.className = "fa-solid fa-play text-lg ml-1";
            }
        }

        // Выбор трека из списка
        function selectTrack(index) {
            if (currentTrackIndex === index) {
                togglePlay();
                return;
            }
            loadTrack(index);
            audio.play().then(() => {
                isPlaying = true;
                updatePlayIcons(true);
                playerStatus.textContent = "Воспроизведение";
                renderPlaylist();
            });
        }

        // Следующий трек
        function nextTrack() {
            if (isShuffle) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentTrackIndex && playlist.length > 1);
                currentTrackIndex = randomIndex;
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            }
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play();
            }
        }

        // Предыдущий трек
        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play();
            }
        }

        // Обновление прогресс-бара
        function updateProgress() {
            if (isNaN(audio.duration)) return;
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${progressPercent}%`;

            currentTimeEl.textContent = formatTime(audio.currentTime);
            totalDurationEl.textContent = formatTime(audio.duration);
        }

        // Перемотка кликом по шкале
        function seekAudio(event) {
            const container = document.getElementById('progress-container');
            const clickX = event.offsetX;
            const width = container.clientWidth;
            const duration = audio.duration;
            if (!isNaN(duration)) {
                audio.currentTime = (clickX / width) * duration;
            }
        }

        // Форматирование времени
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Конец трека
        function handleTrackEnd() {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
                if (isPlaying) audio.play();
            }
        }

        // Обработка ошибки аудио
        function handleAudioError() {
            playerStatus.textContent = "Ошибка загрузки трека";
            isPlaying = false;
            updatePlayIcons(false);
        }

        // Переключение режимов Shuffle / Repeat
        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffle-btn');
            if (isShuffle) {
                btn.classList.add('text-accent', 'bg-white/5');
                btn.classList.remove('text-white/50');
            } else {
                btn.classList.remove('text-accent', 'bg-white/5');
                btn.classList.add('text-white/50');
            }
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            const btn = document.getElementById('repeat-btn');
            if (isRepeat) {
                btn.classList.add('text-accent', 'bg-white/5');
                btn.classList.remove('text-white/50');
            } else {
                btn.classList.remove('text-accent', 'bg-white/5');
                btn.classList.add('text-white/50');
            }
        }

        // Управление громкостью
        function setVolume(value) {
            audio.volume = value;
            const icon = document.getElementById('volume-icon');
            if (value == 0) {
                icon.className = "fa-solid fa-volume-xmark";
            } else if (value < 0.5) {
                icon.className = "fa-solid fa-volume-low";
            } else {
                icon.className = "fa-solid fa-volume-high";
            }
        }

        function toggleMute() {
            const slider = document.getElementById('volume-slider');
            if (audio.volume > 0) {
                previousVolume = audio.volume;
                slider.value = 0;
                setVolume(0);
            } else {
                slider.value = previousVolume;
                setVolume(previousVolume);
            }
        }

        // Кастомное модальное окно вместо alert()
        function showModal(title, text) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
