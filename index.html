<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Громкий Шепот — Музыкальный проект</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1115;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #181b22;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #232731;
        }
        .header {
            padding: 24px;
            text-align: center;
            background: linear-gradient(135deg, #1f2430 0%, #181b22 100%);
            border-bottom: 1px solid #232731;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f0f3f6;
        }
        .header p {
            font-size: 14px;
            color: #8b949e;
        }
        .player-body {
            padding: 24px;
        }
        .track-info {
            text-align: center;
            margin-bottom: 24px;
        }
        .track-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 14px;
            color: #8b949e;
        }
        .progress-container {
            background: #2b313d;
            border-radius: 4px;
            height: 6px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            position: relative;
        }
        .progress-bar {
            background: #58a6ff;
            border-radius: 4px;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .btn {
            background: transparent;
            border: none;
            color: #f0f3f6;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, color 0.2s;
        }
        .btn:hover {
            color: #58a6ff;
        }
        .btn-play {
            width: 54px;
            height: 54px;
            background: #58a6ff;
            color: #0f1115;
            border-radius: 50%;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
        }
        .btn-play:hover {
            background: #79bbff;
            color: #0f1115;
            transform: scale(1.05);
        }
        .playlist-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .playlist {
            max-height: 240px;
            overflow-y: auto;
            border-radius: 8px;
            background: #12151b;
            border: 1px solid #232731;
        }
        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #2b313d;
            border-radius: 3px;
        }
        .playlist-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #1f2430;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: background 0.2s;
        }
        .playlist-item:last-child {
            border-bottom: none;
        }
        .playlist-item:hover {
            background: #1f2430;
        }
        .playlist-item.active {
            background: #1f2430;
            color: #58a6ff;
            font-weight: 600;
        }
        .footer {
            text-align: center;
            padding: 16px;
            background: #12151b;
            border-top: 1px solid #232731;
            font-size: 12px;
            color: #8b949e;
        }
        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Громкий Шепот</h1>
            <p>Независимый музыкальный проект</p>
        </div>

        <div class="player-body">
            <div class="track-info">
                <div class="track-title" id="trackTitle">Выберите трек</div>
                <div class="track-artist" id="trackArtist">Громкий Шепот</div>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="controls">
                <button class="btn" id="prevBtn" title="Предыдущий">⏮</button>
                <button class="btn btn-play" id="playBtn" title="Play/Pause">▶</button>
                <button class="btn" id="nextBtn" title="Следующий">⏭</button>
            </div>

            <div class="playlist-title">Плейлист</div>
            <div class="playlist" id="playlistContainer"></div>
        </div>

        <div class="footer">
            Официальная страница проекта • <a href="https://vk.com" target="_blank">ВКонтакте</a>
        </div>
    </div>

    <audio id="audio"></audio>

    <script>
        const playlist = [
            { title: "Неоновая Пепельница", artist: "Громкий Шепот", src: "%D0%9D%D0%B5%D0%BE%D0%BD%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%9F%D0%B5%D0%BF%D0%B5%D0%BB%D1%8C%D0%BD%D0%B8%D1%86%D0%B0.mp3" },
            { title: "Чёрная пантера", artist: "Громкий Шепот", src: "%D0%A7%D1%91%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BF%D0%B0%D0%BD%D1%82%D0%B5%D1%80%D0%B0.mp3" },
            { title: "Туман", artist: "Громкий Шепот", src: "%D0%A2%D1%83%D0%BC%D0%B0%D0%BD.mp3" },
            { title: "Настрой", artist: "Громкий Шепот", src: "%D0%9D%D0%B0%D1%81%D1%82%D1%80%D0%BE%D0%B9.mp3" },
            { title: "Личные кружки", artist: "Громкий Шепот", src: "%D0%9B%D0%B8%D1%87%D0%BD%D1%8B%D0%B5%20%D0%BA%D1%80%D1%83%D0%B6%D0%BA%D0%B8.mp3" },
            { title: "Я выбираю себя", artist: "Громкий Шепот", src: "%D0%AF%20%D0%B2%D1%8B%D0%B1%D0%B8%D1%80%D0%B0%D1%8E%20%D1%81%D0%B5%D0%B1%D1%8F.mp3" },
            { title: "Просто скажи", artist: "Громкий Шепот", src: "%D0%9F%D1%80%D0%BE%D1%81%D1%82%D0%BE%20%D1%81%D0%BA%D0%B0%D0%B6%D0%B8.mp3" },
            { title: "Трасса", artist: "Громкий Шепот", src: "%D0%A2%D1%80%D0%B0%D1%81%D1%81%D0%B0.mp3" },
            { title: "Свёрток в руках", artist: "Громкий Шепот", src: "%D0%A1%D0%B2%D1%91%D1%80%D1%82%D0%BE%D0%BA%20%D0%B2%20%D1%80%D1%83%D0%BA%D0%B0%D1%85.mp3" },
            { title: "Апрель взял выходной", artist: "Громкий Шепот", src: "%D0%90%D0%BF%D1%80%D0%B5%D0%BB%D1%8C%20%D0%B2%D0%B7%D1%8F%D0%BB%20%D0%B2%D1%8B%D1%85%D0%BE%D0%B4%D0%BD%D0%BE%D0%B9.mp3" },
            { title: "Феникс это красиво", artist: "Громкий Шепот", src: "%D0%A4%D0%B5%D0%BD%D0%B8%D0%BA%D1%81%20%D1%8D%D1%82%D0%BE%20%D0%BA%D1%80%D0%B0%D1%81%D0%B8%D0%B2%D0%BE.mp3" },
            { title: "Мой ремонт", artist: "Громкий Шепот", src: "%D0%9C%D0%BE%D0%B9%20%D1%80%D0%B5%D0%BC%D0%BE%D0%BD%D1%82.mp3" },
            { title: "Сервер гудит", artist: "Громкий Шепот", src: "%D0%A1%D0%B5%D1%80%D0%B2%D0%B5%D1%80%20%D0%B3%D1%83%D0%B4%D0%B8%D1%82.mp3" },
            { title: "Закамск В Зеркалах", artist: "Громкий Шепот", src: "%D0%97%D0%B0%D0%BA%D0%B0%D0%BC%D1%81%D0%BA%20%D0%92%20%D0%97%D0%B5%D1%80%D0%BA%D0%B0%D0%BB%D0%B0%D1%85.mp3" },
            { title: "Я пантера", artist: "Громкий Шепот", src: "%D0%AF%20%D0%BF%D0%B0%D0%BD%D1%82%D0%B5%D1%80%D0%B0.mp3" },
            { title: "Я котёнок", artist: "Громкий Шепот", src: "%D0%AF%20%D0%BA%D0%BE%D1%82%D1%91%D0%BD%D0%BE%D0%BA.mp3" },
            { title: "Всё будет в кайф (на расслабоне)", artist: "Громкий Шепот", src: "%D0%92%D1%81%D1%91%20%D0%B1%D1%83%D0%B4%D0%B5%D1%82%20%D0%B2%20%D0%BA%D0%B0%D0%B9%D1%84%20(%D0%BD%D0%B0%20%D1%80%D0%B0%D1%81%D1%81%D0%BB%D0%B0%D0%B1%D0%BE%D0%BD%D0%B5).mp3" },
            { title: "Блондинка мечта", artist: "Громкий Шепот", src: "%D0%91%D0%BB%D0%BE%D0%BD%D0%B4%D0%B8%D0%BD%D0%BA%D0%B0%20%D0%BC%D0%B5%D1%87%D1%82%D0%B0.mp3" },
            { title: "Колыбельная для Леночки", artist: "Громкий Шепот", src: "%D0%9A%D0%BE%D0%BB%D1%8B%D0%B1%D0%B5%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F%20%D0%B4%D0%BB%D1%8F%20%D0%9B%D0%B5%D0%BD%D0%BE%D1%87%D0%BA%D0%B8.mp3" },
            { title: "Ты моя (ранняя версия)", artist: "Громкий Шепот", src: "%D0%A2%D1%8B%20%D0%BC%D0%BE%D1%8F%20(%D1%80%D0%B0%D0%BD%D0%BD%D1%8F%D1%8F%20%D0%B2%D0%B5%D1%80%D1%81%D0%B8%D1%8F%20).mp3" },
            { title: "Фонари-Поцелуи", artist: "Громкий Шепот", src: "%D0%A4%D0%BE%D0%BD%D0%B0%D1%80%D0%B8-%D0%9F%D0%BE%D1%86%D0%B5%D0%BB%D1%83%D0%B8.mp3" },
            { title: "72 ЧАСА (Таймер)", artist: "Громкий Шепот", src: "72%20%D0%A7%D0%90%D0%A1%D0%90%20(%D0%A2%D0%B0%D0%B9%D0%BC%D0%B5%D1%80).mp3" },
            { title: "Ты моя (регги)", artist: "Громкий Шепот", src: "%D0%A2%D1%8B%20%D0%BC%D0%BE%D1%8F%20(%D1%80%D0%B5%D0%B3%D0%B3%D0%B8).mp3" },
            { title: "Ты моя (дуэт)", artist: "Громкий Шепот", src: "%D0%A2%D1%8B%20%D0%BC%D0%BE%D1%8F%20(%D0%B4%D1%83%D1%8D%D1%82).mp3" },
            { title: "Возвращайся в жизнь", artist: "Громкий Шепот", src: "%D0%92%D0%BE%D0%B7%D0%B2%D1%80%D0%B0%D1%89%D0%B0%D0%B9%D1%81%D1%8F%20%D0%B2%20%D0%B6%D0%B8%D0%B7%D0%BD%D1%8C.mp3" }
        ];

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const playlistContainer = document.getElementById('playlistContainer');

        let currentTrackIndex = 0;

        function loadPlaylistUI() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === currentTrackIndex) item.classList.add('active');
                item.innerHTML = `<span>${track.title}</span>`;
                item.addEventListener('click', () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    playTrack();
                });
                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index) {
            trackTitle.textContent = playlist[index].title;
            trackArtist.textContent = playlist[index].artist;
            audio.src = playlist[index].src;
            loadPlaylistUI();
        }

        function playTrack() {
            audio.play();
            playBtn.textContent = '⏸';
        }

        function pauseTrack() {
            audio.pause();
            playBtn.textContent = '▶';
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                if (!audio.src) loadTrack(currentTrackIndex);
                playTrack();
            } else {
                pauseTrack();
            }
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        loadTrack(0);
    </script>
</body>
</html>
